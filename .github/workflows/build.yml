name: build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 署名鍵を復元（Secretから。リポジトリには入れない）
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::RELEASE_KEYSTORE_B64 が未設定"; exit 1; fi
          echo "$KS_B64" | base64 -d > release.keystore

      - name: ビルド
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: bash build.sh

      - name: 鍵を消す
        if: always()
        run: rm -f release.keystore

      - name: APKと latest.json をリポジトリに戻す
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assistant.apk latest.json
          git commit -m "Build APK [skip ci]" || { echo "変更なし"; exit 0; }
          git push
